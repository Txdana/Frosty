name: Refresh dependency lockfile (audit branch)

on:
  push:
    branches:
      - audit/dependency-refresh

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: "!contains(github.event.head_commit.message, '[lock-refresh]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile for the selected supported tool versions
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Apply compatible dependency security fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Verify lockfile consistency
        run: npm ci --ignore-scripts
      - name: Capture remaining dependency advisories
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable}))},null,2))"
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frosty-npm-audit
          path: npm-audit.json
          if-no-files-found: warn
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile did not change."
          else
            git commit -m "Refresh npm lockfile [lock-refresh]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
